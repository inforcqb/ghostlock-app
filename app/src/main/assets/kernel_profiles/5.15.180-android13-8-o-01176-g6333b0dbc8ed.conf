# PJA110 实测校正（2026-09-28）：这台机器的 mcast 载体实测落点对应
# waiter_off = 32（tcp6 是唯一让 0x90B 窗口完整覆盖 0x58 waiter 的载体）；
# 模板里的 96 会让伪造 waiter 在喷射页内错位 64 字节 ⇒ 写到别处/踩坏相邻结构 ⇒ panic。
# 同时把 w1_attempts 对齐到已验证的 1（one-shot 路线本就不能安全重试，
# 引擎在非 resident 路线下也会强制 1；这里写死是为了让 blob 与真机 profile 完全一致）。
execution {
  stages {
    w1_attempts = 1
  }
}