name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_extractor:
        description: "Skip the Rust extractor (its CI step and the macOS/Windows jobs). Use for app-only or asset-only changes."
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Test extractor
        if: ${{ inputs.skip_extractor != true }}
        working-directory: tools/extract_rs
        run: |
          cargo test --release --features http
          cargo build --release --features http

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Decode Android signing key
        # Sign every non-PR run with the release key, not just main: the debug
        # keystore is generated fresh on each runner, so two branch builds would
        # carry different signatures and every reinstall would need an uninstall
        # (which also drops the Shizuku grant).
        if: ${{ github.event_name != 'pull_request' }}
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      - name: Build Ghostlock binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make ghostlock
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all ghostlock || true

      # Both artifacts are now the **pinned** KernelSU build `v3.3.0-69-gdf03912f` (tiann/KernelSU,
      # CI run 37882323514, 2026-10-09), committed under `prebuilt/kernelsu-3.3.0-69-gdf03912f/`:
      #
      #  * `ksud` (the standalone aarch64 artifact; upstream's manager APK does *not* bundle one, so
      #    there is nothing to unzip) -> jniLibs/arm64-v8a/libksud.so. The chain calls it as
      #    `ksud resetprop …` (busybox style) from the app's own copy in /data/local/tmp/gl-w1.
      #  * the manager APK itself -> `assets/device/sukisu-manager.apk`. It is bundled because the
      #    device must not have to reach GitHub (国内网络到 GitHub 不稳): the app pushes it and the
      #    chain installs it with root (`pm install -r`).
      #
      # A pinned copy instead of "latest release", because KernelSU publishes no release for that
      # commit (CI artifacts only, and another repository's artifacts need a token this job does not
      # have). The sha256 below is what makes the pin real: a silent swap fails the build.
      - name: Stage the pinned ksud + manager (KernelSU v3.3.0-69-gdf03912f)
        env:
          KSUD_SHA256: a14b5980d4b857542c920a3a22625cbba34edd6ea4741230bb1d25d93516c4ce
          MANAGER_SHA256: 9acd811cd611b7f4d95fdfcd06d0bb228c2807606fd66d24915a08b5cc6dcde3
        run: |
          set -euo pipefail
          SRC=prebuilt/kernelsu-3.3.0-69-gdf03912f
          test -s "$SRC/ksud"
          test -s "$SRC/kernelsu-manager.apk"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/device
          cp "$SRC/ksud" app/src/main/jniLibs/arm64-v8a/libksud.so
          cp "$SRC/kernelsu-manager.apk" app/src/main/assets/device/sukisu-manager.apk
          echo "$KSUD_SHA256  app/src/main/jniLibs/arm64-v8a/libksud.so" | sha256sum -c -
          echo "$MANAGER_SHA256  app/src/main/assets/device/sukisu-manager.apk" | sha256sum -c -
          # libksud.so is an executable, not a shared library: it has to be an ELF aarch64 file the
          # device can run, and `keepDebugSymbols` in app/build.gradle.kts keeps the NDK's strip off
          # it. A shared object here would fail much later, on the device.
          head -c 4 app/src/main/jniLibs/arm64-v8a/libksud.so | od -An -tx1 | grep -q '7f 45 4c 46'
          file app/src/main/jniLibs/arm64-v8a/libksud.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libksud.so | grep -E 'Class|Type|Machine'
          sha256sum app/src/main/jniLibs/arm64-v8a/libksud.so app/src/main/assets/device/sukisu-manager.apk
          ls -l app/src/main/jniLibs/arm64-v8a/libksud.so app/src/main/assets/device/sukisu-manager.apk

      # The signing keystore lives in a PRIVATE repo (inforcqb/ghostlock-keys) so the public tree
      # no longer carries the private key. CI clones it with a read-only deploy key held in the
      # repository secret KEYSTORE_DEPLOY_KEY and drops it where KEYSTORE_PATH (below) points:
      # `<repo root>/keystore.jks`. The sha256 is printed so it can be compared with the key that
      # signed earlier releases -- a different hash means a different signature, i.e. every
      # installed device would need an uninstall first.
      - name: Fetch the signing keystore from the private repo
        env:
          KEYSTORE_DEPLOY_KEY: ${{ secrets.KEYSTORE_DEPLOY_KEY }}
          # `Decode Android signing key` above writes keystore.jks from this secret; when it is
          # configured that key wins (the documented priority) and this step stays out of the way.
          SIGNING_KEY_SECRET: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_REPO: inforcqb/ghostlock-keys
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEY_SECRET}" ]; then
            echo "the SIGNING_KEY secret is set -- keeping the keystore it decoded, skipping the private-repo fetch"
            exit 0
          fi
          if [ -z "${KEYSTORE_DEPLOY_KEY}" ]; then
            echo "::warning::KEYSTORE_DEPLOY_KEY is not set -- falling back to whatever key the tree has; the signature may differ from previous releases"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEYSTORE_DEPLOY_KEY" > ~/.ssh/gl-keys
          chmod 600 ~/.ssh/gl-keys
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gl-keys -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 "git@github.com:${KEYSTORE_REPO}.git" /tmp/gl-keys
          cp /tmp/gl-keys/ghostlock-dev.jks keystore.jks
          echo "keystore fetched from ${KEYSTORE_REPO}:"
          sha256sum keystore.jks
          ls -l keystore.jks

      # A release signed with nothing -- or with a freshly generated debug key -- is worse than a
      # failed build: it looks fine and silently breaks `adb install -r` on every installed device.
      # (Pull requests cannot read repository secrets, so they only warn.)
      - name: Require the fetched keystore
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ ! -s keystore.jks ]; then
            echo "::error::keystore.jks is missing or empty -- the private-repo fetch did not run (check the KEYSTORE_DEPLOY_KEY secret and the deploy key on inforcqb/ghostlock-keys)"
            exit 1
          fi

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          # No signing secrets are configured in this repository, so the keystore fetched above
          # is used with the values recorded in ghostlock-keys/README.md. If secrets are ever
          # added, they win (they are non-empty and the assignments below keep them).
          : "${KEYSTORE_PASS:=ghostlock-dev}"
          : "${KEY_ALIAS:=ghostlock}"
          : "${KEY_PASSWORD:=ghostlock-dev}"
          export KEYSTORE_PASS KEY_ALIAS KEY_PASSWORD
          ./gradlew :app:assembleRelease --no-daemon

      - name: Strip Ghostlock binary
        run: |
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all ghostlock || true

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/*.apk GhostLock-release.apk

      - name: Prepare extractor binaries
        if: ${{ inputs.skip_extractor != true }}
        run: |
          cp tools/extract_rs/target/release/ghostlock-extract tools/extract_rs/ghostlock-extract-linux-x86_64

          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android --features http --manifest-path tools/extract_rs/Cargo.toml \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          cp tools/extract_rs/target/aarch64-linux-android/release/ghostlock-extract tools/extract_rs/ghostlock-extract-android-arm64

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-release
          path: GhostLock-release.apk
          archive: false

      - name: Upload Ghostlock binary
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock
          path: ghostlock
          archive: false

      - name: Upload Extractor Linux
        if: ${{ inputs.skip_extractor != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-linux-x86_64
          path: tools/extract_rs/ghostlock-extract-linux-x86_64
          archive: false

      - name: Upload Extractor Android
        if: ${{ inputs.skip_extractor != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-android-arm64
          path: tools/extract_rs/ghostlock-extract-android-arm64
          archive: false

  build-extractor-macos:
    name: Build Extractor (macOS)
    runs-on: macos-latest
    if: ${{ inputs.skip_extractor != true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build macOS universal binary
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http --target aarch64-apple-darwin
          cargo build --release --features http --target x86_64-apple-darwin
          mkdir -p bin
          lipo -create -output bin/ghostlock-extract-macos-universal \
            target/aarch64-apple-darwin/release/ghostlock-extract \
            target/x86_64-apple-darwin/release/ghostlock-extract

      - name: Upload Extractor macOS
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-macos-universal
          path: tools/extract_rs/bin/ghostlock-extract-macos-universal
          archive: false

  build-extractor-windows:
    name: Build Extractor (Windows)
    runs-on: windows-latest
    if: ${{ inputs.skip_extractor != true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build Windows binary
        shell: bash
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http
          mkdir -p bin
          cp target/release/ghostlock-extract.exe bin/ghostlock-extract-windows-x86_64.exe

      - name: Upload Extractor Windows
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-windows-x86_64
          path: tools/extract_rs/bin/ghostlock-extract-windows-x86_64.exe
          archive: false

  release:
    name: Release
    # Only the APK is published, so the extractor jobs must not gate it.
    needs: [build-apk]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The APK is uploaded with `archive: false`, which names the artifact after the FILE
      # (`GhostLock-release.apk`), so it is found by pattern rather than by name -- looking it
      # up as `GhostLock-release` failed the whole job ("Artifact not found for name").
      # Only the APK lands in release-files, and only release-files is published.
      - name: Keep only the APK
        run: |
          mkdir -p release-files
          APK=$(find artifacts -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" release-files/GhostLock-release.apk
          sha256sum release-files/GhostLock-release.apk

      - name: Build the release notes
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          APK_SHA=$(sha256sum release-files/GhostLock-release.apk | cut -d' ' -f1)

          {
            echo "### GhostLock"
            echo
            echo "- **Version**: \`v${VERSION_NAME}\` (\`${COMMIT_COUNT}\`)"
            echo "- **Commit**: [\`${SHORT_HASH}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo
            echo "#### Commit message"
            echo '```'
            echo "${COMMIT_MSG}"
            echo '```'
            echo
            echo "#### Files"
            echo "- \`GhostLock-release.apk\` — GhostLock for Android (arm64-v8a)"
            echo
            echo "#### SHA256"
            echo '```'
            echo "${APK_SHA}  GhostLock-release.apk"
            echo '```'
          } > release-notes.md

      - name: Update the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f release
          git push -f origin release
          gh release edit release --target ${GITHUB_SHA} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release
          target_commitish: ${{ github.sha }}
          name: GhostLock
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: release-files/GhostLock-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post_telegram:
    needs: [build-apk, build-extractor-macos, build-extractor-windows]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Post to Telegram
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_LINK: ${{ secrets.BOT_API_LINK }}
        run: bash .github/scripts/post_telegram.sh
