name: Bin

# Fast path used while calibrating: build *only* the native artifacts -- the
# ghostlock engine and the ported Magica JNI library (libmagica2.so).  Same
# toolchain/cache as build.yml, but no JDK/gradle/APK and no Rust extractor
# jobs, so a build is ~1-2 min instead of ~10.  It runs on main too, so a
# native-only break shows up in minutes instead of after the whole APK build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mcast-msfilter-calib
    paths-ignore:
      - "**.md"

env:
  ONDK_VERSION: "r30.1"

jobs:
  bin:
    name: Build native artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o /tmp/ondk.tar.xz
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf /tmp/ondk.tar.xz

      - name: Build Ghostlock binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make ghostlock

      - name: Strip Ghostlock binary
        run: |
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all ghostlock || true

      # The same target Gradle's buildMagica2Jni runs (`make magica2jni`): the
      # ported Magica root-shell JNI library, .build/jni/libmagica2.so.  It is
      # checked here because an APK build that dies inside it costs ten minutes;
      # the readelf dump makes the "no libc++_shared.so" property visible.
      - name: Build libmagica2.so
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make magica2jni
          bin="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$bin/llvm-strip" --strip-all .build/jni/libmagica2.so || true
          echo "--- NEEDED ---"
          "$bin/llvm-readelf" -d .build/jni/libmagica2.so | grep -E "NEEDED|SONAME" || true
          echo "--- exported JNI symbols ---"
          "$bin/llvm-nm" -D --defined-only .build/jni/libmagica2.so | grep -c "Java_" || true
      - name: Upload Ghostlock binary
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock
          path: ghostlock
          archive: false

      - name: Upload libmagica2.so
        uses: actions/upload-artifact@v7
        with:
          name: libmagica2
          path: .build/jni/libmagica2.so
          archive: false
